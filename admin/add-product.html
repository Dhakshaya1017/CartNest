<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Add Product — Brand Name</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../assets/css/style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
  </head>
  <body>
    <nav class="navbar">
      <div class="container navbar-inner">
        <a href="index.html" class="brand">
          <span class="brand-mark"><i class="fa-solid fa-bolt"></i></span>
          <span>Brand Name Admin</span>
        </a>
        <div class="nav-links">
          <a href="index.html">Overview</a>
          <a href="products.html" class="active">Products</a>
          <a href="orders.html">Orders</a>
          <a href="customers.html">Customers</a>
        </div>
        <div class="nav-actions">
          <a class="btn btn-outline btn-sm" href="products.html">Back</a>
          <button class="btn btn-ghost nav-toggle" aria-label="Toggle menu"><i class="fa-solid fa-bars"></i></button>
        </div>
      </div>
    </nav>

    <main class="container section">
      <div class="auth-card reveal" style="width: min(760px,100%);">
        <span class="badge"><i class="fa-solid fa-plus"></i> Product placeholder</span>
        <h2>Add new product</h2>
        <p class="subtitle">This form is ready for your product data structure.</p>
        <div class="form-row">
          <div class="field">
            <label>Name</label>
            <input type="text" placeholder="Product name" />
          </div>
          <div class="field">
            <label>Category</label>
            <select>
              <option>Category Placeholder</option>
              <option>Category Placeholder</option>
              <option>Category Placeholder</option>
            </select>
          </div>
          <div class="field">
            <label>Price</label>
            <input type="text" placeholder="Price Placeholder" />
          </div>
          <div class="field">
            <label>Description</label>
            <textarea rows="4" placeholder="Description Placeholder"></textarea>
          </div>
          <button class="btn btn-primary" data-toast="Placeholder action">Publish product</button>
        </div>
      </div>
    </main>

    <div class="toast-stack"></div>
    <script src="../assets/js/main.js"></script>
  </body>
</html>
