<!-- PRODUCTS SECTION -->


<section class="container section">


<div class="section-title">


<h2>

Explore Collection

</h2>


<p>

Fashion, Beauty, Electronics & Lifestyle Products

</p>


</div>



<div class="shop-tools">


<input

type="text"

id="productSearch"

placeholder="Search products, brands and more...">



<select id="categoryFilter">


<option value="all">

All Categories

</option>


<option value="Men">

Men

</option>


<option value="Women">

Women

</option>




<option value="Home & Living">

Home & Living

</option>


<option value="Beauty">

Beauty

</option>


<option value="Electronics">

Electronics

</option>


<option value="Accessories">

Accessories

</option>


</select>



</div>




<div id="productGrid" class="product-grid">


</div>



</section>




<script>


const productGrid = document.getElementById("productGrid");


let allProducts = [];



// LOAD PRODUCTS


async function loadProducts(){


try{


const response = await fetch(
"http://localhost:5000/api/products"
);



const data = await response.json();



allProducts = data.products || data || [];



const params = new URLSearchParams(window.location.search);



const selectedCategory = params.get("category");

const searchQuery = params.get("search");



let filteredProducts = allProducts;



if(selectedCategory){


filteredProducts = filteredProducts.filter(product =>


product.category &&

product.category.toLowerCase() === selectedCategory.toLowerCase()


);


}



if(searchQuery){


filteredProducts = filteredProducts.filter(product =>


product.name.toLowerCase().includes(searchQuery.toLowerCase())

||


(product.description &&

product.description.toLowerCase().includes(searchQuery.toLowerCase()))


);


}



displayProducts(filteredProducts);



}


catch(error){


console.log(error);


productGrid.innerHTML = `

<div class="empty-state">

<h2>

Unable to load products

</h2>

<p>

Please try again later.

</p>

</div>

`;

}


}
// DISPLAY PRODUCTS


function displayProducts(products){


productGrid.innerHTML = "";



if(products.length === 0){


productGrid.innerHTML = `

<div class="empty-state">

<h2>

No Products Found

</h2>


<p>

Try another category or search keyword.

</p>


</div>

`;


return;

}





products.forEach(product=>{


let stockText = "In Stock";

let stockClass = "in-stock";



if(product.stock == 0){


stockText = "Out of Stock";

stockClass = "out-stock";


}

else if(product.stock <= 10){


stockText = "Only Few Left";

stockClass = "low-stock";


}



const price = Number(product.price) || 0;

const oldPrice = Math.round(price * 1.3);



productGrid.innerHTML += `


<div class="product-card">



<div class="product-image">


<img

src="${product.image}"

alt="${product.name}"

onerror="this.src='../assets/images/placeholder-product.svg'">


<div

class="wishlist-btn"

onclick="addToWishlist(${product.id})">


<i class="fa-regular fa-heart"></i>


</div>


</div>




<div class="product-info">



<span class="category-badge">

${product.category}

</span>




<h3>

${product.name}

</h3>




<p>

${product.description || "Premium quality product"}

</p>




<div class="rating">

⭐ ⭐ ⭐ ⭐ ☆

<span>

4.5

</span>

</div>




<div class="price-box">


<span class="price">

₹${price.toLocaleString("en-IN")}

</span>



<span class="old-price">

₹${oldPrice.toLocaleString("en-IN")}

</span>



<span class="discount">

30% OFF

</span>



</div>




<div class="stock ${stockClass}">

${stockText}

</div>





<button

class="btn btn-primary"

${product.stock == 0 ? "disabled" : ""}

onclick="addToCart(${product.id})">


${product.stock == 0 ? "Unavailable" : "Add To Cart"}



</button>




</div>




</div>


`;


});


}






// CATEGORY FILTER


document
.getElementById("categoryFilter")
.addEventListener("change", function(){


const category = this.value;



if(category === "all"){


displayProducts(allProducts);


}

else{


const filtered = allProducts.filter(product =>


product.category &&

product.category.toLowerCase() === category.toLowerCase()


);



displayProducts(filtered);



}


});






// SEARCH FUNCTION


document

.getElementById("productSearch")

.addEventListener("keyup", function(){



const value = this.value.toLowerCase().trim();



const filtered = allProducts.filter(product =>



(product.name &&

product.name.toLowerCase().includes(value))



||



(product.description &&

product.description.toLowerCase().includes(value))



||



(product.category &&

product.category.toLowerCase().includes(value))



);



displayProducts(filtered);



});
// ADD TO CART


async function addToCart(productId){


const user = JSON.parse(localStorage.getItem("user"));



if(!user){


window.location.href="login.html";

return;


}



try{


const response = await fetch(

"http://localhost:5000/api/cart/add",

{


method:"POST",


headers:{


"Content-Type":"application/json"


},


body:JSON.stringify({


user_id:user.id,


product_id:productId,


quantity:1


})


}

);




const data = await response.json();



showToast(data.message || "Added to Cart");



if(typeof updateCartCount === "function"){


updateCartCount();


}



}



catch(error){


console.log(error);


showToast("Unable to add product");


}



}






// ADD TO WISHLIST


async function addToWishlist(productId){



const user = JSON.parse(localStorage.getItem("user"));



if(!user){


window.location.href="login.html";


return;


}




try{


const response = await fetch(

"http://localhost:5000/api/wishlist/add",

{


method:"POST",


headers:{


"Content-Type":"application/json"


},


body:JSON.stringify({


user_id:user.id,


product_id:productId


})


}

);




const data = await response.json();



showToast(data.message || "Added to Wishlist");



if(typeof updateWishlistCount === "function"){


updateWishlistCount();


}



}



catch(error){


console.log(error);


showToast("Unable to add wishlist item");


}



}






// INITIAL LOAD


document.addEventListener("DOMContentLoaded",()=>{


loadProducts();


});




// RELOAD WHEN PAGE RETURNS


window.addEventListener("focus",()=>{


loadProducts();


});



</script>
