<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact — Brand Name</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../assets/css/style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
  </head>
  <body>
    <nav class="navbar">
      <div class="container navbar-inner">
        <a href="index.html" class="brand">
          <span class="brand-mark"><i class="fa-solid fa-bolt"></i></span>
          <span>Brand Name</span>
        </a>
        <div class="nav-links">
          <a href="index.html">Home</a>
          <a href="products.html">Shop</a>
          <a href="about.html">About</a>
          <a href="contact.html" class="active">Contact</a>
        </div>
        <div class="nav-actions">
          <a class="btn btn-outline btn-sm" href="role-selection.html">Login</a>
          <a class="btn btn-primary btn-sm" href="cart.html"><i class="fa-solid fa-bag-shopping"></i> Cart</a>
          <button class="btn btn-ghost nav-toggle" aria-label="Toggle menu"><i class="fa-solid fa-bars"></i></button>
        </div>
      </div>
    </nav>

    <main class="container section">
      <div class="auth-card reveal" style="width: min(760px,100%); margin: 0 auto;">
        <span class="badge"><i class="fa-solid fa-headset"></i> Placeholder support</span>
        <h2>Contact section</h2>
        <p class="subtitle">This contact form is ready for your backend integration.</p>
        <div class="form-row">
          <div class="field">
            <label>Name</label>
            <input type="text" placeholder="Your name" />
          </div>
          <div class="field">
            <label>Email</label>
            <input type="email" placeholder="you@example.com" />
          </div>
          <div class="field">
            <label>Message</label>
            <textarea rows="4" placeholder="How can we help?"></textarea>
          </div>
          <button class="btn btn-primary" data-toast="Placeholder action">Send message</button>
        </div>
      </div>
    </main>

    <div class="toast-stack"></div>
    <script src="../assets/js/main.js"></script>
  </body>
</html>
