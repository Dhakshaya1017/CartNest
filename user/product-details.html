<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Product Details — Brand Name</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../assets/css/style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
  </head>
  <body>
    <nav class="navbar">
      <div class="container navbar-inner">
        <a href="index.html" class="brand">
          <span class="brand-mark"><i class="fa-solid fa-bolt"></i></span>
          <span>Brand Name</span>
        </a>
        <div class="nav-links">
          <a href="index.html">Home</a>
          <a href="products.html">Shop</a>
          <a href="dashboard.html">Dashboard</a>
          <a href="orders.html">Orders</a>
        </div>
        <div class="nav-actions">
          <a class="btn btn-outline btn-sm" href="role-selection.html">Login</a>
          <a class="btn btn-primary btn-sm" href="cart.html"><i class="fa-solid fa-bag-shopping"></i> Cart</a>
          <button class="btn btn-ghost nav-toggle" aria-label="Toggle menu"><i class="fa-solid fa-bars"></i></button>
        </div>
      </div>
    </nav>

    <main class="container product-detail-grid">
      <section class="gallery-card reveal">
        <img src="../assets/images/placeholder-product.svg" alt="Product Image" />
      </section>
      <section class="info-card reveal">
        <span class="badge"><i class="fa-solid fa-fire"></i> Placeholder item</span>
        <h1>Product Name</h1>
        <p class="meta">Category Placeholder</p>
        <div class="pricing">Price Placeholder</div>
        <p style="color: var(--muted);">Description Placeholder</p>
        <div class="card-actions" style="margin-bottom: 1rem;">
          <button class="btn btn-primary" data-toast="Added to cart"><i class="fa-solid fa-cart-plus"></i> Add to cart</button>
          <a href="checkout.html" class="btn btn-outline"><i class="fa-solid fa-credit-card"></i> Buy now</a>
        </div>
        <div class="spec-list">
          <div><strong>Category:</strong> Category Placeholder</div>
          <div><strong>Availability:</strong> Placeholder</div>
          <div><strong>Shipping:</strong> Placeholder</div>
          <div><strong>Notes:</strong> Placeholder</div>
        </div>
      </section>
    </main>

    <div class="toast-stack"></div>
    <script src="../assets/js/main.js"></script>
  </body>
</html>
