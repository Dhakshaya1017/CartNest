<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CartNest | My Orders</title>

<link rel="stylesheet" href="../assets/css/style.css">

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>



<div id="navbar"></div>

<section class="container section">

<div class="section-title">

<h2>My Orders</h2>

<p>Track all your orders</p>

</div>

<div id="ordersContainer"></div>

</section>

<script src="../assets/js/main.js"></script>
<script src="../assets/js/navbar.js"></script>

<script>

const user=JSON.parse(localStorage.getItem("user"));

if(!user){

window.location.href="login.html";

}

const ordersContainer=document.getElementById("ordersContainer");

async function loadOrders(){

try{

const response=await fetch(

`http://localhost:5000/api/orders/${user.id}`

);

const data=await response.json();

ordersContainer.innerHTML="";

if(!data.success || data.orders.length===0){

ordersContainer.innerHTML="<h2>No Orders Found</h2>";

return;

}

data.orders.forEach(order=>{

let badgeClass="badge-pending";

if(order.status==="Confirmed") badgeClass="badge-confirmed";

if(order.status==="Delivered") badgeClass="badge-delivered";

if(order.status==="Cancelled") badgeClass="badge-cancelled";

ordersContainer.innerHTML+=`

<div class="order-card fade">

<h3>

Order #${order.id}

</h3>

<br>

<p>

<strong>Total :</strong>

₹${order.total_amount}

</p>

<p>

<strong>Payment :</strong>

${order.payment_method || "Cash on Delivery"}

</p>

<p>

<strong>Payment Status :</strong>

${order.payment_status || "Pending"}

</p>

<p>

<strong>Order Date :</strong>

${new Date(order.created_at).toLocaleString()}

</p>

<br>

<span class="badge ${badgeClass}">

${order.status}

</span>

${
order.status==="Pending"
?

`<br><br>

<button

class="btn btn-danger"

onclick="cancelOrder(${order.id})">

Cancel Order

</button>`

:""

}

</div>

`;

});

}

catch(error){

console.log(error);

}

}

async function cancelOrder(id){

if(!confirm("Cancel this order?")) return;

const response=await fetch(

`http://localhost:5000/api/orders/cancel/${id}`,

{

method:"PUT"

}

);

const data=await response.json();

alert(data.message);

loadOrders();

}

loadOrders();

</script>

</body>

</html>
