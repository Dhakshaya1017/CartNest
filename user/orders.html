<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Orders — Brand Name</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../assets/css/style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
  </head>
  <body>
    <nav class="navbar">
      <div class="container navbar-inner">
        <a href="index.html" class="brand">
          <span class="brand-mark"><i class="fa-solid fa-bolt"></i></span>
          <span>Brand Name</span>
        </a>
        <div class="nav-links">
          <a href="index.html">Home</a>
          <a href="products.html">Shop</a>
          <a href="dashboard.html">Dashboard</a>
          <a href="orders.html">Orders</a>
        </div>
        <div class="nav-actions">
          <a class="btn btn-outline btn-sm" href="dashboard.html">Dashboard</a>
          <a class="btn btn-primary btn-sm" href="cart.html"><i class="fa-solid fa-bag-shopping"></i> Cart</a>
          <button class="btn btn-ghost nav-toggle" aria-label="Toggle menu"><i class="fa-solid fa-bars"></i></button>
        </div>
      </div>
    </nav>

    <main class="container section">
      <div class="section-title reveal">
        <div>
          <span class="badge"><i class="fa-solid fa-box"></i> Order placeholder</span>
          <h2>My orders</h2>
        </div>
      </div>
      <div class="table-card reveal">
        <table>
          <thead>
            <tr>
              <th>Order</th>
              <th>Placed</th>
              <th>Status</th>
              <th>Total</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>#0000</td>
              <td>Placeholder date</td>
              <td><span class="badge success">Placeholder</span></td>
              <td>Price Placeholder</td>
            </tr>
            <tr>
              <td>#0001</td>
              <td>Placeholder date</td>
              <td><span class="badge">Placeholder</span></td>
              <td>Price Placeholder</td>
            </tr>
          </tbody>
        </table>
      </div>
    </main>

    <script src="../assets/js/main.js"></script>
  </body>
</html>
